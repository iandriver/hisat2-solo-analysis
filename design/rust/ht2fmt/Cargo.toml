[package]
name = "ht2fmt"
version = "0.1.0"
edition = "2021"

# Builder prototype for the HISAT2 .ht2 format.
#   ht2fmt   - rung 1: parse an existing index, account for every byte
#   ht2build - rung 2: construct an index and match hisat2-build byte for byte
# No dependencies: the format must be emitted exactly, so the byte layout is
# the thing being owned, not delegated.

[[bin]]
name = "ht2fmt"
path = "src/main.rs"

[[bin]]
name = "ht2build"
path = "src/bin/ht2build.rs"

[profile.release]
debug = true

[[bin]]
name = "ht2invert"
path = "src/bin/ht2invert.rs"

[[bin]]
name = "ht2sacheck"
path = "src/bin/ht2sacheck.rs"

[[bin]]
name = "ht2sa"
path = "src/bin/ht2sa.rs"

[[bin]]
name = "ht2ftab"
path = "src/bin/ht2ftab.rs"

[[bin]]
name = "ht2predict"
path = "src/bin/ht2predict.rs"
